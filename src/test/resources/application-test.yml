spring:
  datasource:
    url: jdbc:h2:mem:transfers-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;LOCK_TIMEOUT=10000
    username: sa
    password: ""

app:
  security:
    jwt-secret: ${random.value}   # secreto efímero: nunca un valor fijo en el repositorio
    demo-token-endpoint: true
  transfers:
    max-amount: 10000000.00
    daily-limit: 20000000.00

logging:
  level:
    root: WARN
