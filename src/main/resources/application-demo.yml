# Perfil de demostración: base en memoria con datos de ejemplo y un emisor de tokens de prueba.
# NUNCA se activa en AWS (ver infra/terraform: SPRING_PROFILES_ACTIVE=prod).
spring:
  datasource:
    url: jdbc:h2:mem:transfers;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
  flyway:
    locations: classpath:db/migration,classpath:db/demo

app:
  security:
    # Sin secretos en el repositorio: si no se define JWT_SECRET, se genera uno aleatorio al arrancar
    # (32 caracteres). Los tokens dejan de servir al reiniciar, que es justo lo que se espera de una demo.
    jwt-secret: ${JWT_SECRET:${random.value}}
    demo-token-endpoint: true
