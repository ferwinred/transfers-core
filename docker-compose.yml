# Entorno local completo: PostgreSQL + API + front. Abrir http://localhost:8081
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: transfers
      POSTGRES_USER: transfers
      POSTGRES_PASSWORD: ${DB_PASSWORD:-transfers-local}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transfers -d transfers"]
      interval: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: demo       # datos de ejemplo y tokens de prueba…
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/transfers   # …pero sobre PostgreSQL real
      SPRING_DATASOURCE_USERNAME: transfers
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-transfers-local}
      JWT_SECRET: ${JWT_SECRET:-local-compose-secret-cambiar-0123456789abcdef}
    ports:
      - "8080:8080"

  web:
    build: ./web
    depends_on:
      - api
    ports:
      - "8081:80"
