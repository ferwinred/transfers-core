# Entorno local completo: PostgreSQL + API + front. Abrir http://localhost:8081
# Antes de levantarlo: cp .env.example .env  (la contraseña no se versiona)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: transfers
      POSTGRES_USER: transfers
      POSTGRES_PASSWORD: ${DB_PASSWORD:?define DB_PASSWORD en el archivo .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transfers -d transfers"]
      interval: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: demo       # datos de ejemplo y tokens de prueba…
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/transfers   # …pero sobre PostgreSQL real
      SPRING_DATASOURCE_USERNAME: transfers
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?define DB_PASSWORD en el archivo .env}
      # JWT_SECRET no se define: el perfil demo genera uno aleatorio en cada arranque
    ports:
      - "8080:8080"

  web:
    build: ./web
    depends_on:
      - api
    ports:
      - "8081:80"
